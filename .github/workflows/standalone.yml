name: Test standalone ROL

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-standalone:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        compiler: [gcc-12, gcc-14, clang-18, clang-19]
        include:
          - compiler: gcc-12
            cxx: g++-12
            fortran: gfortran-12
            use_sanitizers: true
            install: false
          - compiler: gcc-14
            cxx: g++-14
            fortran: gfortran-14
            use_sanitizers: false
            install: false
          - compiler: clang-18
            cxx: clang++-18
            fortran: gfortran-14
            use_sanitizers: true
            install: false
          - compiler: clang-19
            cxx: clang++-19
            fortran: gfortran-14
            use_sanitizers: false
            install: true
    steps:
    - name: Checkout ROL
      uses: actions/checkout@v7
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: standalone-${{ matrix.compiler }}-${{ matrix.build_type }}
        save: ${{ github.event_name == 'push' }}
    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    - name: Install compiler
      if: ${{ matrix.install }}
      run: sudo apt-get install -y "${{ matrix.compiler }}"
    - name: Check compilers
      run: |
        command -v "${{ matrix.cxx }}"
        command -v "${{ matrix.fortran }}"
    - name: Configure ROL
      run: |
        cmake --preset standalone-ci-${{ matrix.build_type }} \
              -D CMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -D CMAKE_Fortran_COMPILER=${{ matrix.fortran }} \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D USE_SANITIZERS=${{ matrix.use_sanitizers }} \
              -B "build-${{ matrix.compiler }}" \
              -S .
    - name: Build ROL
      run: cmake --build "build-${{ matrix.compiler }}"
    - name: Run CTest
      run: ctest --test-dir "build-${{ matrix.compiler }}" --output-on-failure
