name: Build Python interface

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the sdist and wheels to PyPI"
        type: boolean
        default: false
  # push

env:
  # Pinned so that sdists are reproducible; bump these deliberately.
  PYBIND11_VERSION: "3.1.0"  # keep in sync with pyrol/pyproject.toml
  BINDER_COMMIT: 93efb505172ce0ef34faa1f69a8e8f2b7455ce18

jobs:

  build-sdist:
    # Binder is built against LLVM 15 from apt; with LLVM 18, Binder emits
    # includes of *_Def.hpp headers that break the build.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libopenblas-dev
        # see https://cppbinder.readthedocs.io/en/latest/install.html#id1
        sudo apt-get install -y clang-15 llvm-15 libclang-15-dev llvm-15-dev
        python3 -m pip install build
        python3 -m pip install "pybind11==${PYBIND11_VERSION}"
    - name: Build Binder
      run: |
        git clone https://github.com/RosettaCommons/binder.git ../binder
        git -C ../binder checkout "${BINDER_COMMIT}"
        cmake -G Ninja \
              -D LLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
              -D Clang_DIR=/usr/lib/llvm-15/lib/cmake/clang \
              -D pybind11_DIR=`python3 -c "import pybind11; print(pybind11.get_cmake_dir())"` \
              -B ../binder-build \
              ../binder
        cmake --build ../binder-build
        ctest --test-dir ../binder-build --output-on-failure
        cmake --install ../binder-build
    - name: Build the source distribution (runs Binder)
      # The script developers use too: it clones the latest Trilinos, runs
      # Binder through its configuration and packages the reduced tree.
      run: pyrol/scripts/build_sdist.sh -w "$RUNNER_TEMP/sdist"
    - name: Upload source distribution as an artifact
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: ${{ runner.temp }}/sdist/dist/*.tar.gz

  build-wheels:
    needs: build-sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v7
    - name: Download source distribution artifact
      uses: actions/download-artifact@v8
      with:
        name: sdist
    - name: Store source distribution name
      run: |
        SDIST_NAME=$(find . -name "rol_python-*.tar.gz" -print -quit)
        echo $SDIST_NAME
        echo "SDIST_NAME=${SDIST_NAME}" >> $GITHUB_ENV
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Build wheels (Ubuntu and Mac)
      uses: pypa/cibuildwheel@v3.4.1
      with:
        output-dir: dist
        package-dir: ${{ env.SDIST_NAME }}
      env:
        CIBW_BUILD: "cp3*"
        CIBW_SKIP: "*i686 *musllinux*"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_ALL_LINUX: |
          yum install -y openblas-devel ninja-build
        CIBW_TEST_COMMAND: >-
          cd {project}/packages/rol/pyrol/test/algorithm &&
          python -m unittest test_typeU.py test_typeB.py &&
          cd ../bindings &&
          python -m unittest discover -p "test_*.py" &&
          cd ../examples &&
          python -m unittest test_examples.py
    - name: Set artifact name
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          echo "ARTIFACT_NAME=wheels-linux" >> $GITHUB_ENV
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          echo "ARTIFACT_NAME=wheels-macos" >> $GITHUB_ENV
        fi
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist/*

  publish-pypi:
    if: inputs.publish
    needs:
    - build-sdist
    - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rol-python
    permissions:
      id-token: write
    steps:
    - name: Download the source distribution
      uses: actions/download-artifact@v8
      with:
        name: sdist
        path: dist/
    - name: Download the Linux wheels
      uses: actions/download-artifact@v8
      with:
        name: wheels-linux
        path: dist/
    - name: Download the MacOS wheels
      uses: actions/download-artifact@v8
      with:
        name: wheels-macos
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
